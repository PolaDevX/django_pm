{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="containery">
    <div class="row justify-content-md-center">
        <div class="card col-md-6 px-0 shadow-sm">
            <div class="card-header bg-light">
                <h3 class="mb-0 py-2 text-center">{% trans "Register" %}</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="form-group mb-3">
                        <label for="id_username">{% trans "Username" %}</label>
                        <input type="text" name="username" class="form-control" id="id_username">
                    </div>

                    <div class="form-group mb-3">
                        <label for="id_email">{% trans "Email" %}</label>
                        <input type="email" name="email" class="form-control" id="id_email">
                    </div>

                    <div class="form-group mb-3">
                        <label for="id_password">{% trans "Password" %}</label>
                        <input type="password" name="password" class="form-control" id="id_password">
                    </div>

                    <div class="form-group mb-3">
                        <label for="id_password2">{% trans "Password Confirmation" %}</label>
                        <input type="password" name="password2" class="form-control" id="id_password2">
                    </div>

                    <button class="btn btn-success btn-block">
                        {% translate "Register" %}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
